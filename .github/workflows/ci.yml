name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: flake check (eval only, all systems)
        run: nix flake check --all-systems --no-build
      - name: Instantiate the universal system (catches config/module errors)
        run: |
          nix eval --raw \
            .#nixosConfigurations.universal.config.system.build.toplevel.drvPath

  build-packages:
    name: Build packages (aarch64 via emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Register binfmt_misc so the x86 runner can execute aarch64 binaries,
      # letting Nix build aarch64-linux derivations under QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Build ustreamer (aarch64-linux)
        run: nix build --print-build-logs .#packages.aarch64-linux.ustreamer
      - name: Build kvmd (aarch64-linux)
        run: nix build --print-build-logs .#packages.aarch64-linux.kvmd
      - name: Build the vendor-kernel systems (kernels from binary cache)
        run: |
          nix build --print-build-logs \
            .#nixosConfigurations.rpi4.config.system.build.toplevel \
            .#nixosConfigurations.zero2w.config.system.build.toplevel
      - name: Build the MCP server (x86_64, native)
        # Non-blocking: onnxruntime-node is fixed upstream, but auto-patchelf
        # still trips on sharp's musl prebuilts (libc.musl-*.so.1). Re-blocks
        # once the upstream package.nix prunes/ignores the musl variants.
        continue-on-error: true
        run: nix build --print-build-logs .#packages.x86_64-linux.pikvm-mcp-server
