name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # determinate: false — vanilla/upstream Nix, kept for predictability
      # (see build-packages/vm-test's copy of this comment).
      #
      # allow-import-from-derivation = true — the ACTUAL fix for CI's
      # `nix flake check` failing with "path '.../kvmd-4.188.drv' is not
      # valid": pkgs/kvmd-extras/default.nix does `builtins.readDir
      # "${kvmd}/share/kvmd/extras"`, a genuine Import-From-Derivation — it
      # needs kvmd's OUTPUT to exist to enumerate that directory, which is
      # an implicit build regardless of `--no-build` on the check itself. A
      # fresh nix-installer runner's default nix.conf doesn't allow IFD, so
      # evaluation hits the not-yet-built (and, under --no-build, never-to-
      # be-built) kvmd output and fails exactly this way. Confirmed directly
      # against a real CI run (not theorized): the SAME failure reproduced
      # under vanilla Nix on this runner (ruling out Determinate Nix as the
      # true variable — nixos-developer-system's original diagnosis missed
      # this because their local machine's own nix.conf already allows IFD,
      # masking it). A local machine that already has kvmd built/cached
      # never exercises this path either way — only a genuinely fresh store
      # does, which is exactly what every CI run starts from.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            allow-import-from-derivation = true
      - name: flake check (eval only, all systems)
        run: nix flake check --all-systems --no-build
      - name: Instantiate the universal system (catches config/module errors)
        run: |
          nix eval --raw \
            .#nixosConfigurations.universal.config.system.build.toplevel.drvPath

  build-packages:
    name: Build packages (aarch64 via emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Register binfmt_misc so the x86 runner can execute aarch64 binaries,
      # letting Nix build aarch64-linux derivations under QEMU.
      - uses: docker/setup-qemu-action@v3
      # determinate: false — see the eval job's comment on this same flag.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Build ustreamer (aarch64-linux)
        run: nix build --print-build-logs .#packages.aarch64-linux.ustreamer
      - name: Build kvmd (aarch64-linux)
        run: nix build --print-build-logs .#packages.aarch64-linux.kvmd
      - name: Build the vendor-kernel systems (kernels from binary cache)
        run: |
          nix build --print-build-logs \
            .#nixosConfigurations.rpi4.config.system.build.toplevel \
            .#nixosConfigurations.zero2w.config.system.build.toplevel
      - name: Build the MCP server (x86_64, native)
        run: nix build --print-build-logs .#packages.x86_64-linux.pikvm-mcp-server

  vm-test:
    name: NixOS VM tests (kvmd-services + mcp-proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The mcp-proxy check is a 2-node VM that also builds the MCP server
      # (onnxruntime/sharp) — reclaim runner disk so it fits.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      # runNixOSTest boots a real VM under QEMU/KVM. GitHub's Linux runners
      # expose /dev/kvm, so the x86_64-linux check runs natively (no emulation).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # determinate: false — see the eval job's comment on this same flag.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - name: Run the kvmd-services VM test
        run: nix build --print-build-logs .#checks.x86_64-linux.kvmd-services
      # Unified-auth end-to-end (kvmd + nginx front-door + mcp security=kvmd).
      - name: Run the mcp-proxy VM test
        run: nix build --print-build-logs .#checks.x86_64-linux.mcp-proxy
      # HID recovery: real UDC re-enumeration + polkit least-privilege +
      # the authenticated loopback endpoint → systemctl path.
      - name: Run the hid-recovery VM test
        run: nix build --print-build-logs .#checks.x86_64-linux.hid-recovery
