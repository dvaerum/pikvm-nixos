name: Update MCP pin

# Weekly bump of the `pikvm-mcp-server` flake input (the /mcp endpoint served by
# services.pikvm-mcp).
#
# WHY THIS IS PR-GATED (unlike the nixpkgs bump in update.yml, which is
# straight-to-main on a build gate): the MCP server governs /mcp authentication
# and behaviour, and every deployed KVM self-updates from `main` weekly. A bad
# MCP bump pushed straight to main would roll a broken/insecure auth flow out to
# every device on its next cycle. So this bump goes via a PULL REQUEST instead:
# update-flake-lock opens a PR, the PR runs the full CI VM suite (ci.yml's
# vm-test job — the mcp-proxy unified-auth flow + hid-recovery + kvmd-services),
# and a human merges ONLY when that suite is green.
#
# Tracks pikvm-mcp-server EXPLICITLY and on its own schedule/workflow, kept
# independent from the nixpkgs track so a broken MCP bump never blocks the
# nixpkgs bump and vice-versa.

on:
  schedule:
    - cron: "43 3 * * 1" # Mondays 03:43 UTC (staggered after update.yml's nixpkgs bump)
  workflow_dispatch:

concurrency:
  group: update-mcp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Bump pikvm-mcp-server and open a PR
        uses: DeterminateSystems/update-flake-lock@main
        with:
          # ONLY this input — nixpkgs stays on update.yml's straight-to-main path.
          inputs: pikvm-mcp-server
          branch: automated/mcp-pin
          commit-msg: "ci: bump pikvm-mcp-server pin (MCP /mcp endpoint)"
          pr-title: "ci: bump pikvm-mcp-server pin"
          pr-body: |
            Automated weekly bump of the `pikvm-mcp-server` flake input (the /mcp
            endpoint served by `services.pikvm-mcp`).

            PR-gated (not straight-to-main) because the MCP server governs /mcp
            auth + behaviour and deployed devices self-update from `main`. Merge
            ONLY when the CI VM suite is green — it exercises the endpoint
            end-to-end: `checks.x86_64-linux.mcp-proxy` (unified-auth flow through
            the nginx front-door), `hid-recovery`, and `kvmd-services`.
          # The PR MUST trigger ci.yml so the VM suite runs on it. A PR opened
          # with the default GITHUB_TOKEN does NOT trigger other workflows
          # (GitHub's recursion guard), so pass a PAT/GitHub-App token here —
          # repo secret FLAKE_UPDATE_TOKEN, scopes contents + pull-requests +
          # workflow. Without it the PR opens but the VM suite never runs, so the
          # gate is silently empty.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
