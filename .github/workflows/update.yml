name: Update flake inputs

# Weekly: bump the tracked flake inputs — nixpkgs (the base) AND pikvm-mcp-server
# (the /mcp endpoint) — build + VM-test to prove they still work, and only then
# commit the new flake.lock STRAIGHT TO main. Deployed devices self-update from
# main weekly, so a verified bump here rolls out to every KVM on its next cycle,
# and a bump that fails is never committed.
#
# Why straight-to-main is safe even for the auth/behaviour-affecting MCP input:
# the gate below runs the full NixOS VM suite (incl. mcp-proxy, which exercises
# the /mcp unified-auth flow end-to-end) INLINE in this job, before the commit —
# so a broken MCP or nixpkgs bump fails the gate and never pushes. That inline
# gate is what a separate PR + required-checks would buy, without the
# cross-workflow PR-trigger + FLAKE_UPDATE_TOKEN machinery. nixpkgs and
# pikvm-mcp-server are bumped together: if the gate fails, NEITHER ships — we
# don't commit a lock we couldn't verify. (disko is intentionally PR-pinned and
# nixos-raspberrypi is left alone here; only the two tracked inputs auto-bump.)
on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: docker/setup-qemu-action@v3
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - name: Bump the tracked inputs (nixpkgs + the MCP /mcp endpoint)
        run: nix flake update nixpkgs pikvm-mcp-server

      - name: Show lock diff
        run: git --no-pager diff -- flake.lock || true

      - name: Verify it still builds (aarch64 via emulation)
        run: |
          nix flake check --all-systems --no-build
          nix build --print-build-logs \
            .#packages.aarch64-linux.ustreamer \
            .#packages.aarch64-linux.kvmd \
            .#nixosConfigurations.rpi4.config.system.build.toplevel \
            .#nixosConfigurations.zero2w.config.system.build.toplevel

      # These bumps are pushed STRAIGHT TO main and every deployed KVM
      # self-updates from main weekly — so a bump (nixpkgs OR pikvm-mcp-server)
      # that builds but breaks a service at runtime would silently ship to every
      # device. Gate on the same VM suite CI runs on PRs (kvmd actually serves,
      # OTG HID + polkit recovery, and the unified-auth /mcp flow through the
      # nginx front-door) so a runtime regression blocks the commit instead of
      # reaching devices. runNixOSTest needs /dev/kvm.
      - name: Enable KVM (for the VM suite)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate on the NixOS VM suite (runtime regressions block the push)
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.kvmd-services \
            .#checks.x86_64-linux.mcp-proxy \
            .#checks.x86_64-linux.hid-recovery

      - name: Commit the verified bump
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "pikvm-nixos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flake.lock
          git commit -m "ci: weekly flake input bump — nixpkgs + pikvm-mcp-server (VM-verified)"
          git push
