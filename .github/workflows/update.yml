name: Update flake inputs

# Weekly: bump ALL flake inputs (bare `nix flake update` — nixpkgs,
# nixos-raspberrypi, disko, pikvm-mcp-server, and any future input), build +
# VM-test to prove they still work, and only then commit the new flake.lock
# STRAIGHT TO main. Deployed devices self-update from main weekly, so a verified
# bump here rolls out to every KVM on its next cycle, and a bump that fails is
# never committed.
#
# Why straight-to-main is safe even for the auth/behaviour-affecting MCP input:
# the gate below runs the full NixOS VM suite (incl. mcp-proxy, which exercises
# the /mcp unified-auth flow end-to-end) INLINE in this job, before the commit —
# so a broken MCP or nixpkgs bump fails the gate and never pushes. That inline
# gate is what a separate PR + required-checks would buy, without the
# cross-workflow PR-trigger + FLAKE_UPDATE_TOKEN machinery. nixpkgs and
# pikvm-mcp-server are bumped together: if the gate fails, NEITHER ships — we
# don't commit a lock we couldn't verify. (disko is intentionally PR-pinned and
# nixos-raspberrypi is left alone here; only the two tracked inputs auto-bump.)
on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: docker/setup-qemu-action@v3
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      # Auto-advance nixpkgs across NixOS STABLE releases (26.05 → 26.11 → …).
      # `nix flake update` only follows the latest commit on whatever branch the
      # URL names, so it never jumps releases on its own. Here we find the newest
      # existing stable branch (nixos-YY.05 / nixos-YY.11) on NixOS/nixpkgs and,
      # if it's newer than the pinned ref, rewrite flake.nix so the relock below
      # moves onto it. A release jump is potentially breaking — that's fine: the
      # VM gate validates it before the commit, so a jump that breaks the
      # appliance fails the gate and never ships (a real "needs migration"
      # signal). Only STABLE releases (never nixos-unstable / -small / staging).
      - name: Advance nixpkgs to the newest stable NixOS release (if any)
        run: |
          set -euo pipefail
          current=$(grep -oE 'github:NixOS/nixpkgs/nixos-[0-9]{2}\.[0-9]{2}' flake.nix \
            | grep -oE 'nixos-[0-9]{2}\.[0-9]{2}' | head -1)
          newest=$(git ls-remote --heads https://github.com/NixOS/nixpkgs 'nixos-*' \
            | sed 's#.*refs/heads/##' \
            | grep -E '^nixos-[0-9]{2}\.(05|11)$' \
            | sort -V | tail -1)
          echo "pinned=$current  newest-stable=$newest"
          if [ -z "$newest" ]; then
            echo "::warning::could not list nixpkgs release branches; keeping $current"
          elif [ "$newest" != "$current" ] \
            && [ "$(printf '%s\n%s\n' "$current" "$newest" | sort -V | tail -1)" = "$newest" ]; then
            echo "::notice::NixOS release advancing $current -> $newest"
            sed -i -E "s#(github:NixOS/nixpkgs/)nixos-[0-9]{2}\.[0-9]{2}#\1$newest#" flake.nix
            echo "RELEASE_ADVANCE=$current -> $newest" >> "$GITHUB_ENV"
          else
            echo "already on the newest stable release ($current); no advance"
          fi

      # Bump ALL inputs (bare `nix flake update`) — no list to maintain, and any
      # future input is auto-covered. This includes disko: its
      # `github:nix-community/disko?ref=pull/1190/merge` pin is GitHub's FLOATING
      # auto-merge ref, so relocking re-merges PR #1190 against the latest
      # upstream disko base — keeping disko current AND re-incorporating the
      # cross-compile disk-format patch every bump, as long as the PR stays open.
      # (nixos-raspberrypi breakage is caught by the rpi4/zero2w toplevel build
      # below. disko is NOT gate-covered — see the note at its flake.nix input —
      # but a disko break only surfaces at SD-flash/image-build time, never on a
      # deployed device's auto-update, so blast radius is low.)
      - name: Bump all flake inputs
        run: nix flake update

      - name: Show lock diff
        run: git --no-pager diff -- flake.lock || true

      - name: Verify it still builds (aarch64 via emulation)
        run: |
          nix flake check --all-systems --no-build
          nix build --print-build-logs \
            .#packages.aarch64-linux.ustreamer \
            .#packages.aarch64-linux.kvmd \
            .#nixosConfigurations.rpi4.config.system.build.toplevel \
            .#nixosConfigurations.zero2w.config.system.build.toplevel

      # These bumps are pushed STRAIGHT TO main and every deployed KVM
      # self-updates from main weekly — so a bump (nixpkgs OR pikvm-mcp-server)
      # that builds but breaks a service at runtime would silently ship to every
      # device. Gate on the same VM suite CI runs on PRs (kvmd actually serves,
      # OTG HID + polkit recovery, and the unified-auth /mcp flow through the
      # nginx front-door) so a runtime regression blocks the commit instead of
      # reaching devices. runNixOSTest needs /dev/kvm.
      - name: Enable KVM (for the VM suite)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate on the NixOS VM suite (runtime regressions block the push)
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.kvmd-services \
            .#checks.x86_64-linux.mcp-proxy \
            .#checks.x86_64-linux.hid-recovery

      # Stage flake.nix too: the release-advance step above rewrites the nixpkgs
      # ref there when it jumps to a new stable release, and that rewrite must
      # ride along with the relock.
      - name: Commit the verified bump
        run: |
          if git diff --quiet -- flake.lock flake.nix; then
            echo "flake.lock/flake.nix unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "pikvm-nixos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flake.lock flake.nix
          if [ -n "${RELEASE_ADVANCE:-}" ]; then
            git commit -m "ci: NixOS release advanced ${RELEASE_ADVANCE} + weekly input bump (VM-verified)"
          else
            git commit -m "ci: weekly flake input bump — all inputs except the disko pin (VM-verified)"
          fi
          git push
