name: Validate rpi4 flashable image

# On-demand (workflow_dispatch): produce the rpi4 flash image via the REAL install
# path — `disko-install` onto a LOOP-mounted image file — and inspect it OFFLINE
# (no hardware) to validate it's a complete, bootable artifact before anyone
# commits a spare Pi. This exercises exactly what `nix run .#install-sd` does on a
# real card (the path we flagged as "untested even in CI"), and it sidesteps the
# virtiofsd/CI-sandbox limitation that blocks disko's VM-based `diskoImages`.
#
# Reports: (1) the image file + size, (2) the FIRMWARE partition's RPi boot chain
# (u-boot / config.txt / start*.elf / DTBs / overlays incl. tc358743), (3) the
# FAT-firmware + ext4-root layout vs the disko spec, (4) anything that'd block boot.
#
# NOTE: cross build (x86_64 runner → aarch64 image via binfmt) — the exact artifact
# a from-x86_64 user / our own CI produces. A truly native build needs aarch64
# hardware nobody on the team has, so "validated" here means the cross-built image.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: docker/setup-qemu-action@v3
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - name: disko-install onto a loop image, then inspect (the 4 questions)
        run: |
          set -uxo pipefail
          IMG="$PWD/rpi4.img"
          # Room for the 1 GiB firmware partition + ext4 root + the system closure.
          truncate -s 7G "$IMG"
          loop=$(sudo losetup --find --show --partscan "$IMG")
          echo "loop=$loop"

          # `nix run .#install-sd` = `disko-install --flake .#rpi4 --disk main <dev>`.
          # Run as root (disko-install does mkfs/mount/nixos-install), with nix on
          # PATH; mark the checkout safe for root's git so the local flake resolves.
          sudo git config --global --add safe.directory "$PWD"
          set +e
          sudo env "PATH=/nix/var/nix/profiles/default/bin:$PATH" \
            nix run --accept-flake-config '.#install-sd' -- --board rpi4 "$loop"
          install_rc=$?
          set -e
          echo "### disko-install exit code = $install_rc"

          echo "############## (1) image file + size ##############"
          ls -laL "$IMG" || true; du -h "$IMG" || true

          echo "############## re-scan partitions ##############"
          sudo partprobe "$loop" 2>/dev/null || sudo losetup -c "$loop" || true
          sudo fdisk -l "$IMG" || true
          lsblk -o NAME,SIZE,FSTYPE,LABEL "$loop" || true

          echo "############## (3) layout (FAT firmware + ext4 root) vs disko spec ##############"
          sudo parted -s "$IMG" print || true
          sudo blkid "${loop}p1" "${loop}p2" || true

          echo "############## (2) FIRMWARE partition (p1) contents ##############"
          sudo mkdir -p /mnt/fw /mnt/root
          sudo mount -o ro "${loop}p1" /mnt/fw || sudo mount "${loop}p1" /mnt/fw || true
          echo "--- firmware root ---"; sudo ls -la /mnt/fw || true
          echo "--- boot chain (u-boot/start.elf/fixup/bootcode/armstub) ---"
          sudo ls -la /mnt/fw | grep -iE 'u-?boot|start.*\.elf|fixup.*\.dat|bootcode|armstub' || echo '!! NO boot-chain files matched'
          echo "--- DTBs (*.dtb) ---"; sudo ls -la /mnt/fw/*.dtb 2>/dev/null || echo '!! NO *.dtb in firmware root'
          echo "--- overlays (tc358743/dwc2/disable-bt) ---"
          sudo ls -la /mnt/fw/overlays 2>/dev/null | grep -iE 'tc358743|dwc2|disable-bt' || echo '!! tc358743/dwc2/disable-bt overlays NOT found'
          echo "--- config.txt ---"; sudo cat /mnt/fw/config.txt 2>/dev/null || echo '!! NO config.txt'

          echo "############## root partition (p2) sanity ##############"
          sudo mount -o ro "${loop}p2" /mnt/root || true
          sudo ls -la /mnt/root || true
          (sudo test -d /mnt/root/nix/store && echo 'nix store present') || echo '!! NO /nix/store'
          echo "--- /boot ---"; sudo ls -la /mnt/root/boot 2>/dev/null || true

          echo "############## cleanup ##############"
          sudo umount /mnt/fw || true; sudo umount /mnt/root || true
          sudo losetup -d "$loop" || true

          echo "### FINAL: disko-install rc was $install_rc"
          exit "$install_rc"
